modelRoles:
  default: neurawatt/kimi-k3
# Effort is a capability surface, not a budget: pin it explicitly
# instead of leaving the auto classifier to decide.
defaultThinkingLevel: max
# Thinking blocks are display noise for a sandboxed agent.
hideThinkingBlock: true
memory:
  # Project-scoped autonomous memory: at startup omp reads this project's
  # past sessions, extracts durable decisions/pitfalls, and injects a
  # summary into the system prompt. Off by default.
  backend: local
setupVersion: 1
