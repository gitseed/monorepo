static_resources:
  secrets:
  - name: openrouter_api_key
    generic_secret:
      secret:
        environment_variable: OPENROUTER_API_KEY
  - name: ian_neurawatt_api_token
    generic_secret:
      secret:
        environment_variable: IAN_NEURAWATT_API_TOKEN

  # HTTPS listener (the only one): the sandbox container maps each
  # upstream hostname (openrouter.ai, api.neuralwatt.com) to this
  # container's address, so stock clients can use the real endpoint
  # URLs. TLS terminates here with a certificate from infisical
  # (tofu-issued, one SAN per mapped hostname; the sandbox trusts the
  # CA). SNI selects the filter chain; each chain pins its own route
  # and injected credential.
  listeners:
  - name: upstream_https
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 443
    # The sandbox's /etc/hosts maps our routed domains to BOTH loopbacks
    # (127.0.0.1 A and ::1 AAAA); an AAAA-happy client (Bun's happy
    # eyeballs) would otherwise race IPv6 and -- before this additional
    # bind -- hit the *real* upstream with the dummy key: 401 from the
    # genuine node, looking for all the world like a broken token.
    additional_addresses:
    - address:
        socket_address:
          address: "::"
          port_value: 443
    # SNI-based filter chain selection requires the tls_inspector
    # listener filter; without it every handshake fails with
    # "no matching filter chain found".
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filter_chain_match:
        server_names: ["openrouter.ai"]
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            # PEMs come from infisical via the container's environment
            # (see ../scripts/up.sh). No key material on disk, here or
            # on the host.
            - certificate_chain:
                environment_variable: CREDENTIALS_PROXY_SERVER_CERT
              private_key:
                environment_variable: CREDENTIALS_PROXY_SERVER_KEY
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: openrouter
          route_config:
            name: openrouter
            virtual_hosts:
            - name: openrouter
              domains:
              - "openrouter.ai"
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: openrouter
                  host_rewrite_literal: openrouter.ai
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.credential_injector
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
              overwrite: true
              credential:
                name: envoy.http.injected_credentials.generic
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                  credential:
                    name: openrouter_api_key
                  header: Authorization
                  header_value_prefix: "Bearer "
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - filter_chain_match:
        server_names: ["api.neuralwatt.com"]
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                environment_variable: CREDENTIALS_PROXY_SERVER_CERT
              private_key:
                environment_variable: CREDENTIALS_PROXY_SERVER_KEY
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: neuralwatt
          route_config:
            name: neuralwatt
            virtual_hosts:
            - name: neuralwatt
              domains:
              - "api.neuralwatt.com"
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: neuralwatt
                  host_rewrite_literal: api.neuralwatt.com
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.credential_injector
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
              overwrite: true
              credential:
                name: envoy.http.injected_credentials.generic
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                  credential:
                    name: ian_neurawatt_api_token
                  header: Authorization
                  header_value_prefix: "Bearer "
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router



  clusters:
  - name: openrouter
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    wait_for_warm_on_init: false
    typed_dns_resolver_config:
      name: envoy.network.dns_resolver.getaddrinfo
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.getaddrinfo.v3.GetAddrInfoDnsResolverConfig
        num_retries: 1
    # The proxy itself must resolve upstream names to the REAL
    # upstreams. Only the sandbox container gets the proxy address,
    # via its /etc/hosts bind-mount (see ../compose.yml).
    connect_timeout: 2s
    load_assignment:
      cluster_name: openrouter
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: openrouter.ai
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: openrouter.ai

  - name: neuralwatt
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    wait_for_warm_on_init: false
    typed_dns_resolver_config:
      name: envoy.network.dns_resolver.getaddrinfo
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.getaddrinfo.v3.GetAddrInfoDnsResolverConfig
        num_retries: 1
    connect_timeout: 2s
    load_assignment:
      cluster_name: neuralwatt
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api.neuralwatt.com
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.neuralwatt.com
