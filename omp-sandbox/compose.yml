services:
  proxy:
    image: credentials-proxy
    build:
      context: ./container
      dockerfile: proxy.containerfile
    environment:
      - OPENROUTER_API_KEY
      - GITHUB_TOKEN
      - GITHUB_TOKEN_BASIC
      - CREDENTIALS_PROXY_SERVER_CERT
      - CREDENTIALS_PROXY_SERVER_KEY
      - FIRECRAWL_API_KEY
    healthcheck:
      # The envoy image has no curl.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/443'"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
  sandbox:
    image: omp-sandbox
    build:
      context: ./container
      dockerfile: sandbox.containerfile
      secrets: [ca_cert]
    stdin_open: true
    tty: true
    secrets:
      - git_signing_key
    links:
      - "proxy:openrouter.ai"
      - "proxy:api.github.com"
      - "proxy:github.com"
      - "proxy:api.firecrawl.dev"
    volumes:
      - "${GIT_PROJECT_DIR:-..}:/workspace"
    cap_drop:
    - NET_RAW
    - NET_ADMIN
    security_opt: [no-new-privileges:true]
secrets:
  ca_cert:
    environment: CREDENTIALS_PROXY_CA_CERT
  git_signing_key:
    environment: GIT_SIGNING_KEY

# Shared network to enable shared memory.
networks:
  default:
    external: true
    name: omp-sandbox-net
