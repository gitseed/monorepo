services:
  proxy:
    image: credentials-proxy
    build:
      context: ./container
      dockerfile: proxy.containerfile
    environment:
      - OPENROUTER_API_KEY
      - CREDENTIALS_PROXY_SERVER_CERT
      - CREDENTIALS_PROXY_SERVER_KEY
    healthcheck:
      # The envoy image has no curl.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/443'"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
  sandbox:
    image: omp-sandbox
    build:
      context: ./container
      dockerfile: sandbox.containerfile
      secrets: [ca_cert]
    stdin_open: true
    tty: true
    links:
      - "proxy:openrouter.ai"
    volumes:
      - "${GIT_PROJECT_DIR:-..}:/workspace"
      # Persistent agent state (~/.omp: memory, history, sessions, config)
      # lives on the host so it survives teardown and daily image rebuilds.
      - "${OMP_SANDBOX_HOME:-/tmp/omp-sandbox-agent}:/root/.omp"
    cap_drop:
    - NET_RAW
    - NET_ADMIN
    security_opt: [no-new-privileges:true]
secrets:
  ca_cert:
    environment: CREDENTIALS_PROXY_CA_CERT
