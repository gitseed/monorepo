# Long-lived agent memory service.
name: omp-hindsight
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_API_KEY: ${OPENROUTER_API_KEY}
      HINDSIGHT_API_LLM_MODEL: deepseek/deepseek-v4-flash-0731
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    networks:
      - memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/v1/default/banks', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 24
      # First boot is slow.
      start_period: 60s
volumes:
  hindsight-data:
networks:
  memory:
    external: true
    name: omp-sandbox-net
