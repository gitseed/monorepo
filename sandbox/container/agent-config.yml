eval:
  py: false
modelRoles:
  default: openrouter/z-ai/glm-5.2:high
  smol: openrouter/deepseek/deepseek-v4-flash-0731
symbolPreset: nerd
hideThinkingBlock: true
# Built-in memory tools (memory_recall/retain/reflect) stay off; turn
# logging is handled by the postgres memory extension instead (also
# disabled for now — see extensions/memory/).
memory:
  backend: "off"
setupVersion: 1
providers:
  # Exclude providers that fail in a sandboxed/datacenter environment:
  # - duckduckgo: bot-detection challenge on datacenter IPs
  # - google, ecosia, mojeek: require the shared browser daemon (Chromium),
  #   which is not available in the sandbox; they hang or time out.
  # Startpage (scraping fallback) remains the working default.
  webSearchOrder:
    - firecrawl
  webSearchExclude:
    - duckduckgo
    - google
    - ecosia
    - mojeek
edit:
  enabled: false
