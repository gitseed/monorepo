- host: openrouter.ai
  name: openrouter
  secret: openrouter_api_key
  env: OPENROUTER_API_KEY
- host: api.github.com
  name: github
  secret: github_token
  env: GITHUB_TOKEN
- host: github.com
  name: github_git
  secret: github_token_basic
  env: GITHUB_TOKEN_BASIC
  prefix: "Basic "
- host: api.firecrawl.dev
  name: firecrawl
  secret: firecrawl_api_key
  env: FIRECRAWL_API_KEY
- host: mcp.context7.com
  name: context7
  secret: context7_api_key
  env: CONTEXT7_API_KEY
