# Environment variables passed through from infisical into the sandbox
# verbatim. up.bash runs docker compose under `infisical run`, which
# populates these with real values; unlike ai-sandbox there is no proxy to
# substitute them — the sandbox occupant is a trusted human. Only what a
# human actually uses from the ouroboros project: no agent tooling keys
# (openrouter/firecrawl/context7), no proxy artifacts (GITHUB_TOKEN_BASIC).
# Anything absent from the project simply arrives unset.
- GITHUB_TOKEN
- CLOUDFLARE_API_TOKEN
- GIT_SIGNING_KEY
